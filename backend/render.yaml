# Blueprint de Render (render.com) — PaaS gestionado, evita operar
# Kubernetes antes de tener tracción (ver arquitectura, Infraestructura Fase 0-1).
services:
  - type: web
    name: sportapp-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sportapp-db
          property: connectionString
      - key: PORT
        value: 3000
      - key: API_FOOTBALL_KEY
        sync: false # se rellena a mano en el dashboard, nunca en el repo
      - key: FOLLOWED_LEAGUE_IDS
        value: "140"

databases:
  - name: sportapp-db
    plan: starter
    postgresMajorVersion: 16
